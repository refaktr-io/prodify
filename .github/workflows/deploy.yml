name: Deploy to AWS

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # The key includes the commit SHA so CloudFormation sees a property
      # change and updates the function code (a static key never redeploys).
      - name: Package Lambda Code
        run: |
          cd backend/src
          zip -r ../lambda-code.zip *.py
          aws s3 cp ../lambda-code.zip s3://prodify-backend/lambda-code-${GITHUB_SHA}.zip

      - name: Deploy CloudFormation Stack
        run: |
          cd backend
          aws cloudformation deploy \
            --template-file infrastructure/template.yaml \
            --stack-name prodify-backend \
            --parameter-overrides LambdaCodeKey=lambda-code-${GITHUB_SHA}.zip \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset

      - name: Show API URL
        run: |
          aws cloudformation describe-stacks \
            --stack-name prodify-backend \
            --query 'Stacks[0].Outputs[?OutputKey==`ApiUrl`].OutputValue' \
            --output text
