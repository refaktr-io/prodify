AWSTemplateFormatVersion: '2010-09-09'
Description: IAM role assumed by GitHub Actions (OIDC) to deploy the Prodify backend stack. Deploy once, manually.

Parameters:
  GitHubRepository:
    Type: String
    Default: refaktr-io/prodify
    Description: owner/repo allowed to assume the role
  GitHubBranch:
    Type: String
    Default: main
  BackendStackName:
    Type: String
    Default: prodify-backend
  DeploymentPackageBucket:
    Type: String
    Default: prodify-backend
    Description: Bucket the workflow uploads Lambda zips to
  CreateOidcProvider:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Set to false if the account already has the GitHub OIDC provider

Conditions:
  ShouldCreateProvider: !Equals [!Ref CreateOidcProvider, 'true']

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${BackendStackName}-github-deploy"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - ShouldCreateProvider
                - !Ref GitHubOidcProvider
                - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubRepository}:ref:refs/heads/${GitHubBranch}"
      Policies:
        - PolicyName: DeployBackendStack
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: UploadLambdaPackages
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::${DeploymentPackageBucket}/*"
              - Sid: ManageBackendStack
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ValidateTemplate
                Resource:
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${BackendStackName}/*"
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/*"
              # CloudFormation creates the stack's resources with the caller's
              # permissions, so the role needs rights over everything the
              # backend template declares.
              - Sid: BackendStackResources
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:Get*
                  - s3:List*
                  - s3:PutBucketCORS
                  - s3:PutBucketNotification
                  - s3:PutBucketPolicy
                  - s3:DeleteBucketPolicy
                  - s3:PutBucketPublicAccessBlock
                  - s3:PutLifecycleConfiguration
                  - s3:PutBucketTagging
                  - s3:PutEncryptionConfiguration
                  - s3:PutBucketVersioning
                  - s3:PutBucketOwnershipControls
                  - lambda:*
                  - apigateway:*
                  - sns:*
                  - cloudwatch:*
                  - logs:*
                  - ecr:DescribeRepositories
                  - ecr:PutReplicationConfiguration
                  - ecr:DescribeRegistry
                Resource: '*'
              - Sid: ManageStackRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:PassRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${BackendStackName}-*"

Outputs:
  DeployRoleArn:
    Description: Set this as the AWS_DEPLOY_ROLE_ARN repository variable in GitHub
    Value: !GetAtt DeployRole.Arn
