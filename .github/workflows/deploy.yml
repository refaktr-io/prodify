name: Deploy to AWS

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Package Lambda Code
        run: |
          cd backend/src
          zip -r ../lambda-code.zip *.py
          aws s3 cp ../lambda-code.zip s3://prodify-deploy-532931254745-us-east-1/lambda-code.zip

      - name: Deploy CloudFormation Stack
        run: |
          cd backend
          aws cloudformation deploy \
            --template-file infrastructure/template.yaml \
            --stack-name prodify-backend \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset

      - name: Get API URL
        id: get-api-url
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name prodify-backend \
            --query 'Stacks[0].Outputs[?OutputKey==`ApiUrl`].OutputValue' \
            --output text)
          echo "API_URL=$API_URL" >> $GITHUB_OUTPUT
          echo "Deployed API URL: $API_URL"

      - name: Update Frontend
        run: |
          sed -i "s|const API_BASE_URL = '.*';|const API_BASE_URL = '${{ steps.get-api-url.outputs.API_URL }}';|g" frontend/index.html
          echo "Updated frontend/index.html with API URL"

      - name: Commit updated frontend
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add frontend/index.html
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update frontend with deployed API URL [skip ci]"
            git push
          fi
