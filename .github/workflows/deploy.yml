name: Deploy to AWS

on:
  push:
    branches:
      - main
    paths:
      - 'backend/infrastructure/template.yaml'
      - 'backend/src/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Forks: set repository variable AWS_DEPLOY_ROLE_ARN (output of the
# github-oidc.yaml stack). Optional variables: AWS_REGION, DEPLOYMENT_BUCKET,
# STACK_NAME, STAGING_BUCKET_NAME (empty = auto-generated), ALARM_EMAIL,
# DEPLOYER_IMAGE_REGIONS (comma-separated; see replicate-image.sh).
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  DEPLOYMENT_BUCKET: ${{ vars.DEPLOYMENT_BUCKET || 'prodify-backend' }}
  STACK_NAME: ${{ vars.STACK_NAME || 'prodify-backend' }}
  STAGING_BUCKET_NAME: ${{ vars.STAGING_BUCKET_NAME || '' }}
  ALARM_EMAIL: ${{ vars.ALARM_EMAIL || '' }}
  DEPLOYER_IMAGE_REGIONS: ${{ vars.DEPLOYER_IMAGE_REGIONS || 'us-east-1' }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # The key includes the commit SHA so CloudFormation sees a property
      # change and updates the function code (a static key never redeploys).
      - name: Package Lambda Code
        run: |
          cd backend/src
          zip -r ../lambda-code.zip *.py templates/
          aws s3 cp ../lambda-code.zip "s3://${DEPLOYMENT_BUCKET}/lambda-code-${GITHUB_SHA}.zip"

      - name: Deploy CloudFormation Stack
        run: |
          cd backend
          aws cloudformation deploy \
            --template-file infrastructure/template.yaml \
            --stack-name "$STACK_NAME" \
            --parameter-overrides \
              "DeploymentPackageBucket=${DEPLOYMENT_BUCKET}" \
              "LambdaCodeKey=lambda-code-${GITHUB_SHA}.zip" \
              "StagingBucketName=${STAGING_BUCKET_NAME}" \
              "AlarmEmail=${ALARM_EMAIL}" \
              "DeployerImageRegions=${DEPLOYER_IMAGE_REGIONS}" \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset

      - name: Show API URL
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].Outputs[?OutputKey==`ApiUrl`].OutputValue' \
            --output text
