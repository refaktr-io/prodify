AWSTemplateFormatVersion: '2010-09-09'
Description: Prodify Backend - Pure CloudFormation

Parameters:
  DeploymentPackageBucket:
    Type: String
    Default: prodify-backend
    Description: S3 bucket where Lambda deployment packages are stored

  LambdaCodeKey:
    Type: String
    Default: lambda-code.zip
    Description: S3 key of the Lambda deployment package (unique per deploy so CloudFormation picks up code changes)

Resources:
  # S3 Staging Bucket
  StagingBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: prodify-staging
      # ACLs stay blocked; policy-based public access is allowed so the
      # generated/* prefix can be read anonymously (quick-create template URLs
      # must be short-lived-token-free or the console sign-in redirect breaks).
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [PUT, GET, HEAD]
            AllowedOrigins: ['*']
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: DeleteAfter24Hours
            Status: Enabled
            ExpirationInDays: 1

  # Anonymous read of generated templates only. Keys contain an unguessable
  # UUID and objects expire via the lifecycle rule above; uploads/* stays private.
  StagingBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StagingBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadGeneratedTemplates
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub "${StagingBucket.Arn}/generated/*"

  # Lambda Execution Role
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:DeleteObject
                Resource:
                  - !GetAtt StagingBucket.Arn
                  - !Sub "${StagingBucket.Arn}/*"

  # Upload Request Lambda
  UploadRequestFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: prodify-upload-request
      Runtime: python3.13
      Handler: upload_request.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        S3Bucket: !Ref DeploymentPackageBucket
        S3Key: !Ref LambdaCodeKey
      Environment:
        Variables:
          STAGING_BUCKET: !Ref StagingBucket
      Timeout: 30

  UploadRequestPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UploadRequestFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ProdifyApi}/*"

  # Status Lambda
  StatusFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: prodify-status
      Runtime: python3.13
      Handler: status.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        S3Bucket: !Ref DeploymentPackageBucket
        S3Key: !Ref LambdaCodeKey
      Environment:
        Variables:
          STAGING_BUCKET: !Ref StagingBucket
      Timeout: 30

  StatusPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref StatusFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ProdifyApi}/*"

  # Generator Lambda
  GeneratorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: prodify-generator
      Runtime: python3.13
      Handler: generator.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        S3Bucket: !Ref DeploymentPackageBucket
        S3Key: !Ref LambdaCodeKey
      Environment:
        Variables:
          STAGING_BUCKET: !Ref StagingBucket
      Timeout: 60

  GeneratorPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GeneratorFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !GetAtt StagingBucket.Arn

  # S3 Event Configuration (Custom Resource)
  S3NotificationLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3NotificationConfig
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutBucketNotification
                  - s3:GetBucketNotification
                Resource: !GetAtt StagingBucket.Arn

  S3NotificationFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.13
      Handler: index.handler
      Role: !GetAtt S3NotificationLambdaRole.Arn
      Timeout: 30
      Code:
        ZipFile: |
          import json
          import boto3
          import cfnresponse
          
          s3 = boto3.client('s3')
          
          def handler(event, context):
              try:
                  bucket = event['ResourceProperties']['Bucket']
                  function_arn = event['ResourceProperties']['FunctionArn']
                  
                  if event['RequestType'] == 'Delete':
                      s3.put_bucket_notification_configuration(Bucket=bucket, NotificationConfiguration={})
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                      return
                  
                  config = {
                      'LambdaFunctionConfigurations': [{
                          'LambdaFunctionArn': function_arn,
                          'Events': ['s3:ObjectCreated:*'],
                          'Filter': {
                              'Key': {
                                  'FilterRules': [
                                      {'Name': 'prefix', 'Value': 'uploads/'},
                                      {'Name': 'suffix', 'Value': '.zip'}
                                  ]
                              }
                          }
                      }]
                  }
                  
                  s3.put_bucket_notification_configuration(Bucket=bucket, NotificationConfiguration=config)
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
              except Exception as e:
                  print(e)
                  cfnresponse.send(event, context, cfnresponse.FAILED, {})

  S3NotificationCustomResource:
    Type: Custom::S3NotificationConfig
    DependsOn: GeneratorPermission
    Properties:
      ServiceToken: !GetAtt S3NotificationFunction.Arn
      Bucket: !Ref StagingBucket
      FunctionArn: !GetAtt GeneratorFunction.Arn

  # API Gateway
  ProdifyApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: prodify-api
      Description: Prodify Backend API

  # CORS Configuration
  ApiGatewayOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ProdifyApi
      ResourceId: !GetAtt ProdifyApi.RootResourceId
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: '200'
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
              method.response.header.Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: ''
      MethodResponses:
        - StatusCode: '200'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  # /upload-request resource
  UploadRequestResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ProdifyApi
      ParentId: !GetAtt ProdifyApi.RootResourceId
      PathPart: upload-request

  UploadRequestMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ProdifyApi
      ResourceId: !Ref UploadRequestResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UploadRequestFunction.Arn}/invocations"
      MethodResponses:
        - StatusCode: '200'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true

  UploadRequestOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ProdifyApi
      ResourceId: !Ref UploadRequestResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: '200'
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: ''
      MethodResponses:
        - StatusCode: '200'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  # /status resource
  StatusResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ProdifyApi
      ParentId: !GetAtt ProdifyApi.RootResourceId
      PathPart: status

  StatusRequestIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ProdifyApi
      ParentId: !Ref StatusResource
      PathPart: "{requestId}"

  StatusMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ProdifyApi
      ResourceId: !Ref StatusRequestIdResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${StatusFunction.Arn}/invocations"
      MethodResponses:
        - StatusCode: '200'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true

  StatusOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ProdifyApi
      ResourceId: !Ref StatusRequestIdResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: '200'
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type'"
              method.response.header.Access-Control-Allow-Methods: "'GET,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: ''
      MethodResponses:
        - StatusCode: '200'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  # API Deployment
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - UploadRequestMethod
      - StatusMethod
      - UploadRequestOptionsMethod
      - StatusOptionsMethod
    Properties:
      RestApiId: !Ref ProdifyApi

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref ProdifyApi
      DeploymentId: !Ref ApiDeployment
      StageName: Prod

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${ProdifyApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
    Export:
      Name: ProdifyApiUrl
  
  StagingBucketName:
    Description: S3 staging bucket name
    Value: !Ref StagingBucket
