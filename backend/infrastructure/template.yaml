AWSTemplateFormatVersion: '2010-09-09'
Description: Prodify backend - intake API that turns an uploaded project zip into a deployable CloudFormation template

Parameters:
  DeploymentPackageBucket:
    Type: String
    Default: prodify-backend
    Description: Existing S3 bucket where Lambda deployment packages are uploaded (create it before the first deploy)

  LambdaCodeKey:
    Type: String
    Default: lambda-code.zip
    Description: S3 key of the Lambda deployment package (unique per deploy so CloudFormation picks up code changes)

  StagingBucketName:
    Type: String
    Default: ''
    Description: Name for the staging bucket. Leave empty to auto-generate a unique name (recommended for new deployments).

  DeployerImageRepository:
    Type: String
    Default: prodify-content-deployer
    Description: ECR repository name (in this account) holding the content-deployer image, replicated to every region in DeployerImageRegions

  DeployerImageDigest:
    Type: String
    Default: sha256:1d6d6d5e29a8f39b6a7e49ebdb615440adbf02acaced379a1f371ef762ad4886
    AllowedPattern: '^sha256:[0-9a-f]{64}$'
    Description: Digest of the content-deployer image pinned into generated templates (printed by build-and-push.sh)

  DeployerImageRegions:
    Type: CommaDelimitedList
    Default: us-east-1
    Description: Regions the deployer image is available in (see replicate-image.sh). Generated stacks can only be created in these regions.

  MaxUploadBytes:
    Type: Number
    Default: 52428800
    MinValue: 1048576
    Description: Uploads larger than this are rejected by the generator (default 50 MiB)

  AlarmEmail:
    Type: String
    Default: ''
    Description: Optional email address subscribed to the alarm topic (confirm the subscription email after deploy)

Conditions:
  HasStagingBucketName: !Not [!Equals [!Ref StagingBucketName, '']]
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, '']]

Resources:
  # ---------------------------------------------------------------- Storage
  StagingBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !If
        - HasStagingBucketName
        - !Ref StagingBucketName
        - !Sub "prodify-staging-${AWS::AccountId}-${AWS::Region}"
      # ACLs stay blocked; policy-based public access is allowed so the
      # generated/* prefix can be read anonymously (quick-create template URLs
      # must be short-lived-token-free or the console sign-in redirect breaks).
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [PUT, GET, HEAD]
            AllowedOrigins: ['*']
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: ExpireUploads
            Status: Enabled
            Prefix: uploads/
            ExpirationInDays: 1
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
          - Id: ExpireGeneratedTemplates
            Status: Enabled
            Prefix: generated/
            ExpirationInDays: 1
          # examples/ (sample templates published by CI) is permanent.

  # Anonymous read of generated templates (unguessable UUID keys, 1-day
  # expiry) and of the sample templates under examples/. uploads/* stays private.
  StagingBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StagingBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadTemplates
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource:
              - !Sub "${StagingBucket.Arn}/generated/*"
              - !Sub "${StagingBucket.Arn}/examples/*"

  # ------------------------------------------------------------------- IAM
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: StagingBucketAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Resource: !Sub "${StagingBucket.Arn}/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt StagingBucket.Arn

  # --------------------------------------------------------------- Lambdas
  UploadRequestFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: prodify-upload-request
      Runtime: python3.13
      Handler: upload_request.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        S3Bucket: !Ref DeploymentPackageBucket
        S3Key: !Ref LambdaCodeKey
      Environment:
        Variables:
          STAGING_BUCKET: !Ref StagingBucket
          MAX_UPLOAD_BYTES: !Ref MaxUploadBytes
      Timeout: 30

  UploadRequestPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UploadRequestFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ProdifyApi}/*"

  StatusFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: prodify-status
      Runtime: python3.13
      Handler: status.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        S3Bucket: !Ref DeploymentPackageBucket
        S3Key: !Ref LambdaCodeKey
      Environment:
        Variables:
          STAGING_BUCKET: !Ref StagingBucket
          DEPLOYER_IMAGE_REGIONS: !Join [',', !Ref DeployerImageRegions]
      Timeout: 30

  StatusPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref StatusFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ProdifyApi}/*"

  GeneratorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: prodify-generator
      Runtime: python3.13
      Handler: generator.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        S3Bucket: !Ref DeploymentPackageBucket
        S3Key: !Ref LambdaCodeKey
      Environment:
        Variables:
          STAGING_BUCKET: !Ref StagingBucket
          MAX_UPLOAD_BYTES: !Ref MaxUploadBytes
          DEPLOYER_IMAGE_REPOSITORY: !Ref DeployerImageRepository
          DEPLOYER_IMAGE_DIGEST: !Ref DeployerImageDigest
          DEPLOYER_IMAGE_REGIONS: !Join [',', !Ref DeployerImageRegions]
      Timeout: 60

  GeneratorPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GeneratorFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !GetAtt StagingBucket.Arn

  # A bucket can't declare a notification to a function that also depends on
  # the bucket (circular), so a custom resource installs it after both exist.
  S3NotificationLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: S3NotificationConfig
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutBucketNotification
                  - s3:GetBucketNotification
                Resource: !GetAtt StagingBucket.Arn

  S3NotificationFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.13
      Handler: index.handler
      Role: !GetAtt S3NotificationLambdaRole.Arn
      Timeout: 30
      Code:
        ZipFile: |
          import boto3
          import cfnresponse

          s3 = boto3.client('s3')

          def handler(event, context):
              try:
                  bucket = event['ResourceProperties']['Bucket']
                  function_arn = event['ResourceProperties']['FunctionArn']

                  if event['RequestType'] == 'Delete':
                      s3.put_bucket_notification_configuration(Bucket=bucket, NotificationConfiguration={})
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                      return

                  config = {
                      'LambdaFunctionConfigurations': [{
                          'LambdaFunctionArn': function_arn,
                          'Events': ['s3:ObjectCreated:*'],
                          'Filter': {
                              'Key': {
                                  'FilterRules': [
                                      {'Name': 'prefix', 'Value': 'uploads/'},
                                      {'Name': 'suffix', 'Value': '.zip'}
                                  ]
                              }
                          }
                      }]
                  }

                  s3.put_bucket_notification_configuration(Bucket=bucket, NotificationConfiguration=config)
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
              except Exception as e:
                  print(e)
                  cfnresponse.send(event, context, cfnresponse.FAILED, {})

  S3NotificationCustomResource:
    Type: Custom::S3NotificationConfig
    DependsOn: GeneratorPermission
    Properties:
      ServiceToken: !GetAtt S3NotificationFunction.Arn
      Bucket: !Ref StagingBucket
      FunctionArn: !GetAtt GeneratorFunction.Arn

  # ------------------------------------------------------------ API Gateway
  ProdifyApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: prodify-api
      Description: Prodify intake API

  UploadRequestResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ProdifyApi
      ParentId: !GetAtt ProdifyApi.RootResourceId
      PathPart: upload-request

  UploadRequestMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ProdifyApi
      ResourceId: !Ref UploadRequestResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UploadRequestFunction.Arn}/invocations"
      MethodResponses:
        - StatusCode: '200'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true

  UploadRequestOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ProdifyApi
      ResourceId: !Ref UploadRequestResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: '200'
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: ''
      MethodResponses:
        - StatusCode: '200'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  StatusResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ProdifyApi
      ParentId: !GetAtt ProdifyApi.RootResourceId
      PathPart: status

  StatusRequestIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ProdifyApi
      ParentId: !Ref StatusResource
      PathPart: "{requestId}"

  StatusMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ProdifyApi
      ResourceId: !Ref StatusRequestIdResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${StatusFunction.Arn}/invocations"
      MethodResponses:
        - StatusCode: '200'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true

  StatusOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ProdifyApi
      ResourceId: !Ref StatusRequestIdResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: '200'
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type'"
              method.response.header.Access-Control-Allow-Methods: "'GET,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: ''
      MethodResponses:
        - StatusCode: '200'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  # Rename this logical ID (e.g. ApiDeployment2) whenever methods/resources
  # change: a Deployment is immutable and the stage only serves the one it
  # points at.
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - UploadRequestMethod
      - StatusMethod
      - UploadRequestOptionsMethod
      - StatusOptionsMethod
    Properties:
      RestApiId: !Ref ProdifyApi

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref ProdifyApi
      DeploymentId: !Ref ApiDeployment
      StageName: Prod
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          ThrottlingRateLimit: 10
          ThrottlingBurstLimit: 20

  # ------------------------------------------------------------- Alarms
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-alarms"

  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  GeneratorErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-generator-errors"
      AlarmDescription: The generator Lambda failed; uploads are not producing templates
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref GeneratorFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  ApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-api-5xx"
      AlarmDescription: The intake API is returning 5XX responses
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: prodify-api
        - Name: Stage
          Value: !Ref ApiStage
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${ProdifyApi}.execute-api.${AWS::Region}.amazonaws.com/${ApiStage}"
    Export:
      Name: ProdifyApiUrl

  StagingBucketName:
    Description: S3 staging bucket name
    Value: !Ref StagingBucket

  AlarmTopicArn:
    Description: SNS topic that receives alarm notifications
    Value: !Ref AlarmTopic
